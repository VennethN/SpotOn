# Checks on every change, then a deploy as soon as it lands on `main`.
#
# One file, two stages, and the order is what matters: `deploy` waits for `check`
# to pass. If typecheck or build fails, nothing reaches production — that is the
# whole reason these stages are joined rather than split into two workflows
# running independently.
#
# IMPORTANT NOTE: do not enable this workflow alongside Vercel's built-in Git
# integration. If this repository is already connected in the Vercel dashboard,
# every push gets deployed twice — once by Vercel, once by this workflow. Pick
# one: turn off "Connected Git Repository" in Vercel, or delete the `deploy` job
# below and let Vercel handle it.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Consecutive pushes to the same branch do not all need checking; the older runs
# are cancelled. Deploys to `main` are never cancelled midway, so production is
# never left half finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` rather than `npm install`: what gets installed must be exactly
      # what package-lock says, not the newest version that happens to fit the range.
      - run: npm ci

      - name: Typecheck & a11y
        run: npm run check

      - name: Production build
        run: npm run build

  deploy:
    name: Deploy to Vercel
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      # The secrets cannot be set from here, so on the very first run they are
      # almost certainly missing. That is a normal state, not a failure: the
      # workflow stops quietly and says what is missing, rather than leaving a
      # red mark nobody can act on.
      - name: Check Vercel credentials
        id: guard
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice title=Deploy skipped::Set the VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID secrets first, under Settings → Secrets and variables → Actions. See the Deploy section of the README.'
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      # Pulls the project settings along with its production Environment
      # Variables — including PUBLIC_MAPID_STYLE_URL and OPENROUTER_*. Those keys
      # live in Vercel, not in GitHub, so nothing has to be copied to two places.
      - name: Pull project settings
        if: steps.guard.outputs.ready == 'true'
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build in the Vercel environment
        if: steps.guard.outputs.ready == 'true'
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"

      # `--prebuilt` uploads the build above rather than rebuilding on Vercel.
      # What gets deployed is exactly what passed the checks.
      - name: Upload to production
        id: deploy
        if: steps.guard.outputs.ready == 'true'
        run: |
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
